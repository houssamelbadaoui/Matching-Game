<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matching Game</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bg-white border-bottom py-3">
      <div class="container">
        <h2 class="h4 mb-0 fw-bold text-red">Matching Game</h2>
      </div>
    </header>
    <main>
      <div class="container-fluid vh-100 p-2 game-container">
        <div class="container d-flex justify-content-center gap-3 mb-3">
          <div class="stat-box">
            <span class="stat-label">score</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Moves</span>
            <span id="moves" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Player</span>
            <span id="playerName" class="stat-value"></span>
          </div>
          <div class="stat-timer">
            <span id="timer" class="timer">00:00</span>
          </div>
        </div>
        <div
          id="grid"
          class="row row-cols-3 row-cols-md-4 row-cols-lg-5 g-1 mx-auto"
        ></div>

        <div class="start-overlay" id="startOverlay">
          <div class="start-panel">
            <input
              type="text"
              id="usernameInput"
              class="form-control form-control-lg mb-3"
              placeholder="Enter your username"
              maxlength="20"
              autocomplete="off"
            />
            <p id="usernameError" class="text-danger fw-bold d-none">
              Please enter a username first.
            </p>
            <button class="start-button" id="startButton">Start Game</button>
          </div>
        </div>

        <div class="start-overlay d-none" id="endOverlay">
          <div class="start-panel end-panel">
            <h2 id="endTitle"></h2>
            <p>Score: <strong id="endScore"></strong></p>
            <p>Moves: <strong id="endMoves"></strong></p>
            <p>Time: <strong id="endTime"></strong></p>
            <p>Total: <strong id="endTotal">...</strong></p>
            <a href="index.html" class="start-button play-link">View ranking</a>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
