<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matching Game</title>

     <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container text-center py-5">
      <h1 class="welcome-title">Welcome to the Matching Game</h1>
      <p class="welcome-subtitle">Can you make it to the top 5?</p>

      <div class="ranking-box mx-auto">
        <h2 class="ranking-title">Top 5 Players</h2>
        <table class="ranking-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Player</th>
              <th>Score</th>
              <th>Moves</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="rankingBody">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </div>

      <a href="game.html" class="start-button play-link">Play</a>
    </main>

    <script src="ranking.js"></script>
  </body>
</html>
